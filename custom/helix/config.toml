[theme]
light = "catppuccin_latte"
dark = "catppuccin_mocha"
# fallback = "catppuccin_mocha"

[editor]
bufferline = "multiple"
color-modes = true
completion-timeout = 5
cursorline = true
line-number = "relative"
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true

[editor.statusline]
center = []
left = ["mode", "file-name", "read-only-indicator", "file-modification-indicator"]
right = [
    "diagnostics",
    "spinner",
    "selections",
    "register",
    "position",
    "file-encoding",
]

[editor.statusline.mode]
insert = "ι"
normal = "π"
select = "ν"

[keys.insert]
A-c = [":config-open"]
A-e = ["move_next_long_word_start"]
A-u = ["redo"]
A-w = ["move_next_long_word_end", "move_prev_long_word_start", "move_next_long_word_end"]
C-c = "yank_to_clipboard"
C-del = ["move_next_word_start", "delete_selection"]
C-down = ["extend_to_line_bounds", "delete_selection", "paste_after", "move_line_down"]
C-e = ["move_next_word_start"]
C-left = ["move_prev_word_start"]
C-o = ["open_above"]
C-p = ["paste_before"]
C-right = ["move_next_word_end"]
C-s = ["normal_mode", ":w"]
C-space = ["completion"]
C-u = ["undo"]
C-up = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before", "move_line_up"]
C-v = ["paste_clipboard_before"]
C-w = ["move_next_word_end", "move_prev_word_end", "move_next_word_end"]
C-y = ["yank"]
down = "no_op"
end = "no_op"
home = "no_op"
left = "no_op"
pagedown = "no_op"
pageup = "no_op"
right = "no_op"
up = "no_op"

[keys.normal]
A-q = ":q!"
C-q = ":q"
C-s = ":w"
C-y = ":yank-diagnostic"
S-tab = "goto_prev_function"
X = "extend_line_above"
esc = ["collapse_selection", "keep_primary_selection"]
tab = "goto_next_function"

[keys.normal.C-w]
c = ":bc"

[keys.select]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
