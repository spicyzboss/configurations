# Repo-tracked tmux config. Link with ./scripts/link-tmux.

# True color. tmux-256color carries the italics/256-color entry; RGB tells tmux
# the outer terminal takes direct colors.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# What kitty implements beyond the terminfo entry. extkeys is the CSI u
# protocol helix and friends need, clipboard is OSC 52 (see set-clipboard).
set -as terminal-features ",xterm-kitty:extkeys:clipboard:hyperlinks:usstyle:osc7:title"
set -s extended-keys on

# Theme. The plugin is a Nix package symlinked into place by home-manager
# (modules/shared/files.nix), not a clone, so nothing here needs a git pull.
# Window/status options are read when the plugin loads, so they go above `run`.

# Menu styling options
set -g @catppuccin_menu_selected_style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# Pane styling options
set -g @catppuccin_pane_status_enabled "no" # set to "yes" to enable
set -g @catppuccin_pane_border_status "off" # set to "yes" to enable
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_right_separator "█"
set -g @catppuccin_pane_color "#{@thm_green}"
set -g @catppuccin_pane_background_color "#{@thm_surface_0}"
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_number_position "left" # right, left
set -g @catppuccin_window_status_style "basic" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text " #W"
# set -g @catppuccin_window_current_number "#I"
# basic overwrites inactive separators, but current ones stick from an earlier
# rounded load because the plugin sets them with -o. Pin them to match.
set -g @catppuccin_window_current_left_separator " "
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator " "
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "none" # none, icon, or text
set -g @catppuccin_window_flags_icon_last " 󰖰" # -
set -g @catppuccin_window_flags_icon_current " 󰖯" # *
set -g @catppuccin_window_flags_icon_zoom " 󰁌" # Z
set -g @catppuccin_window_flags_icon_mark " 󰃀" # M
set -g @catppuccin_window_flags_icon_silent " 󰂛" # ~
set -g @catppuccin_window_flags_icon_activity " 󱅫" # #
set -g @catppuccin_window_flags_icon_bell " 󰂞" # !
# Matches icon order when using `#F` (`#!~[*-]MZ`)
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "
set -g @catppuccin_date_time_icon ""

# Status line options
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "yes" # yes, no
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

# flavor.conf is a symlink to flavor-mocha.conf or flavor-latte.conf. kitty
# reports OS appearance (mode 2031); the client-*-theme hooks flip the symlink
# and reload. The fish appearance handler does the same on the next prompt as a
# fallback, and so a new server starts on the right flavor before a client has
# reported. -q so a machine that has not run link-tmux still starts.
source-file -q ~/.config/tmux/flavor.conf

# The plugin sets @thm_* with -o, so a flavor switch would keep the previous
# palette. Drop it so this source (hooks, fish, prefix r) can apply the new one.
# date_time bakes its color with -F, so those have to go too.
set -Ugq @thm_bg
set -Ugq @thm_fg
set -Ugq @thm_rosewater
set -Ugq @thm_flamingo
set -Ugq @thm_pink
set -Ugq @thm_mauve
set -Ugq @thm_red
set -Ugq @thm_maroon
set -Ugq @thm_peach
set -Ugq @thm_yellow
set -Ugq @thm_green
set -Ugq @thm_teal
set -Ugq @thm_sky
set -Ugq @thm_sapphire
set -Ugq @thm_blue
set -Ugq @thm_lavender
set -Ugq @thm_subtext_1
set -Ugq @thm_subtext_0
set -Ugq @thm_overlay_2
set -Ugq @thm_overlay_1
set -Ugq @thm_overlay_0
set -Ugq @thm_surface_2
set -Ugq @thm_surface_1
set -Ugq @thm_surface_0
set -Ugq @thm_mantle
set -Ugq @thm_crust
set -Ugq @catppuccin_date_time_color
set -Ugq @catppuccin_status_date_time_icon_fg
set -Ugq @catppuccin_status_date_time_icon_bg
set -Ugq @catppuccin_status_date_time_text_fg
set -Ugq @catppuccin_status_date_time_text_bg
set -Ugq @catppuccin_status_module_text_bg

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
# Matches the scroll_buffer_size the zellij config this replaces used.
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g clock-mode-style 24
set -g display-time 2000
setw -g mode-keys vi
setw -g aggressive-resize on
# Copies reach the system clipboard as OSC 52, which also works over SSH.
set -g set-clipboard on
# Lets a pane forward escape sequences tmux does not understand, which is how
# yazi and friends draw images through the kitty graphics protocol.
set -g allow-passthrough on

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Open new windows and panes in the current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-less pane focus. Arrows rather than Alt+hjkl, which helix already uses
# (Alt+j joins lines) and which kitty forwards verbatim.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch between windows with Alt + 1/2/3....
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Vim-style copy mode. Drag-select already copies and cancels by default, so
# with set-clipboard on the mouse behaves like zellij's copy_on_select.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_date_time}"

# Follow the outer terminal's dark/light report (kitty does this from the OS
# appearance). Skip the reload when the flavor is already right so attaching
# another client does not bounce the status line.
set-hook -g client-dark-theme {
  if-shell -F '#{!=:#{@catppuccin_flavor},mocha}' {
    run-shell 'ln -sfn flavor-mocha.conf ~/.config/tmux/flavor.conf'
    source-file ~/.config/tmux/tmux.conf
  }
}
set-hook -g client-light-theme {
  if-shell -F '#{!=:#{@catppuccin_flavor},latte}' {
    run-shell 'ln -sfn flavor-latte.conf ~/.config/tmux/flavor.conf'
    source-file ~/.config/tmux/tmux.conf
  }
}
