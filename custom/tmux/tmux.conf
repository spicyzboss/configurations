# Repo-tracked tmux config. Link with ./scripts/link-tmux.

# True color. tmux-256color carries the italics/256-color entry; RGB tells tmux
# the outer terminal takes direct colors.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# What kitty implements beyond the terminfo entry. extkeys is the CSI u
# protocol helix and friends need, clipboard is OSC 52 (see set-clipboard).
set -as terminal-features ",xterm-kitty:extkeys:clipboard:hyperlinks:usstyle:osc7:title"
set -s extended-keys on

# Theme. The plugin is a Nix package symlinked into place by home-manager
# (modules/shared/files.nix), not a clone, so nothing here needs a git pull.
# Window/status options are read when the plugin loads, so they go above `run`.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_status_background "default"

# flavor.conf is a symlink to flavor-mocha.conf or flavor-latte.conf, flipped by
# the fish appearance handler (__apply_appearance) since tmux has no native
# light/dark switching. -q so a machine that has not run link-tmux still starts.
source-file -q ~/.config/tmux/flavor.conf

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# General
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
# Matches the scroll_buffer_size the zellij config this replaces used.
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g clock-mode-style 24
set -g display-time 2000
setw -g mode-keys vi
setw -g aggressive-resize on
# Copies reach the system clipboard as OSC 52, which also works over SSH.
set -g set-clipboard on
# Lets a pane forward escape sequences tmux does not understand, which is how
# yazi and friends draw images through the kitty graphics protocol.
set -g allow-passthrough on

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Open new windows and panes in the current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-less pane focus. Arrows rather than Alt+hjkl, which helix already uses
# (Alt+j joins lines) and which kitty forwards verbatim.
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style copy mode. Drag-select already copies and cancels by default, so
# with set-clipboard on the mouse behaves like zellij's copy_on_select.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
