# Repo-tracked kitty config. Link with ./scripts/link-kitty.

# Font
font_family Iosevka Nerd Font Mono
font_size 18

# Thai. Iosevka has no Thai coverage. U+0E01-U+0E5B is every assigned codepoint
# in the Thai block. Swap for "Noto Sans Thai" (loopless), Sarabun, Sukhumvit Set
# or Thonburi to taste.
#
# Stacked marks render correctly in kitty itself, but drift inside zellij 0.44.2,
# which splits the grapheme cluster: printf 'ญี่' emits the base contiguously with
# its vowel and tone outside zellij, and emits the base alone with the marks
# elsewhere inside it. tmux 3.6a keeps the cluster intact. Nothing in this file
# fixes it, and zellij 0.44.3 has no relevant change.
symbol_map U+0E01-U+0E5B Noto Sans Thai Looped
# modify_font cell_height 115%

# Theme
# kitty picks dark-theme.auto.conf / light-theme.auto.conf automatically from the
# OS appearance, replacing the colors below wholesale. This include is the base
# for the case where the OS reports no preference.
include dark-theme.auto.conf

# Shell integration is sourced and configured manually in config.fish
shell_integration no-rc no-cursor

# Scrollback. zellij owns the buffer for panes inside a session and runs in the
# alternate screen, so kitty's own scrollback is barely used there. Keep it
# modest; zellij's scroll_buffer_size is the one that matters day to day.
scrollback_lines 10000

# Disabled: kitty tracks command boundaries via OSC 133 marks from shell
# integration, which have to traverse zellij to reach it. Suspected cause of a
# multi-second stall before the prompt redraws. Re-enable to test.
# notify_on_cmd_finish unfocused 30

# Start the first window of each kitty instance in zellij. New OS windows,
# tabs and windows are unaffected and open a plain shell.
startup_session zellij.session

# Window
hide_window_decorations yes
macos_quit_when_last_window_closed yes
window_padding_width 16
# Option sends Alt, so Alt+key shortcuts work (zellij's Alt bindings, fish's
# Alt+f/Alt+b word motions). Costs the macOS Option+key Unicode input; use
# `left` instead to keep that on the right Option key.
macos_option_as_alt yes

kitty_mod ctrl+shift

# Scrollback
map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+z scroll_to_prompt -1
map kitty_mod+x scroll_to_prompt 1
map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output

# Windows and tabs
map cmd+enter new_window
map kitty_mod+enter new_window_with_cwd
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+d detach_tab ask
map kitty_mod+t launch --cwd=current --type=tab --location=neighbor

# Layouts
map ctrl+alt+t goto_layout tall
map ctrl+alt+s goto_layout stack
