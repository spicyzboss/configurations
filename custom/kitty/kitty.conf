# Repo-tracked kitty config. Link with ./scripts/link-kitty.

# Font
font_family Iosevka Nerd Font Mono
font_size 24

# Theme
# kitty picks dark-theme.auto.conf / light-theme.auto.conf automatically from the
# OS appearance, replacing the colors below wholesale. This include is the base
# for the case where the OS reports no preference.
include dark-theme.auto.conf

# Shell integration is sourced and configured manually in config.fish
shell_integration no-rc no-cursor

# Window
hide_window_decorations yes
window_padding_width 16
macos_option_as_alt no

kitty_mod ctrl+shift

# Scrollback
map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+z scroll_to_prompt -1
map kitty_mod+x scroll_to_prompt 1
map kitty_mod+h show_scrollback
map kitty_mod+g show_last_command_output

# Windows and tabs
map cmd+enter new_window
map kitty_mod+enter new_window_with_cwd
map kitty_mod+] next_window
map kitty_mod+[ previous_window
map kitty_mod+f move_window_forward
map kitty_mod+b move_window_backward
map kitty_mod+d detach_tab ask
map kitty_mod+t launch --cwd=current --type=tab --location=neighbor

# Layouts
map ctrl+alt+t goto_layout tall
map ctrl+alt+s goto_layout stack
